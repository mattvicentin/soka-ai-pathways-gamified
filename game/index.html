<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Pathways Explorer - Game Version</title>
  <meta name="description" content="Visual novel game version of the AI Pathways Explorer" />
  <link rel="stylesheet" href="styles/game.css">
  <!-- Google Fonts: Press Start 2P for retro feel, Inter for readability, Cinzel for elegant old-style parchment text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&family=Special+Elite&family=Cinzel:wght@400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <div id="game-canvas"></div>
    <div id="loading-screen">
      <div class="loading-content">
        <h1>AI Pathways Explorer</h1>
        <div class="loading-bar">
          <div class="loading-progress" id="loading-progress"></div>
        </div>
        <p class="loading-text">Loading game assets...</p>
      </div>
    </div>
  </div>
  
  <!-- Phaser.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  
  <!-- EmailJS for sending emails automatically -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  
  <!-- Game modules -->
  <script type="module" src="./game.js"></script>
</body>
</html>
